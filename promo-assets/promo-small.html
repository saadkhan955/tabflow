<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 440px; height: 280px; background: #080c16; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; background-image: radial-gradient(circle at 50% 30%, rgba(255, 0, 51, 0.22), transparent 60%); }
    .brand-icon { width: 64px; height: 64px; background: linear-gradient(135deg, #ff0033 0%, #ff5252 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(255,0,51,0.4); }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
    p { font-size: 13px; color: #94a3b8; max-width: 340px; line-height: 1.4; margin-bottom: 14px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #10b981; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>
</head>
<body>
  <div class="brand-icon">▶</div>
  <h1>TabFlow</h1>
  <p>Turn open YouTube tabs into organized playlists in seconds &amp; clean duplicate videos.</p>
  <div class="badge">✨ Free &bull; Open Source &bull; Private</div>
</body>
</html>
