<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 440px; height: 280px; background: #0f0f0f; color: #fff; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; background-image: radial-gradient(circle at 50% 30%, rgba(255, 0, 51, 0.25), transparent 60%); }
    .logo { width: 56px; height: 56px; background: #ff0033; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin-bottom: 12px; box-shadow: 0 4px 20px rgba(255,0,51,0.5); }
    h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.2px; margin-bottom: 6px; }
    p { font-size: 11px; color: #aaaaaa; max-width: 320px; line-height: 1.4; margin-bottom: 14px; }
    .tags { display: flex; gap: 6px; }
    .tag { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 9999px; font-size: 9px; font-weight: 600; color: #e5e5e5; }
  </style>
</head>
<body>
  <div class="logo">▶</div>
  <h1>YouTube Tabs to Playlist</h1>
  <p>1-Click Tab Saver, Duplicate Cleaner & Smart AI Playlist Organizer</p>
  <div class="tags">
    <span class="tag">⚡ 1-Click Save</span>
    <span class="tag">🧹 Duplicate Cleaner</span>
    <span class="tag">🤖 AI Genres</span>
  </div>
</body>
</html>
